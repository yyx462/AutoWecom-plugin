# release.yml — on tag log-labor-vX.Y.Z:
#   1. npm/build.sh cross-builds the 5 binaries, tars them (GitHub
#      Release assets — names must byte-match install.sh/install.ps1)
#      and assembles the 6 npm packages (wrapper + 5 platforms).
#   2. publishes the GitHub Release via the built-in GITHUB_TOKEN
#      (contents:write) — this is what makes the curl/PowerShell
#      one-liners work.
#   3. publishes the npm packages:
#      - NPM_TOKEN secret set → classic/granular token publish (a
#        stage-only token stages; approve the version on npmjs.com);
#      - otherwise → trusted publishing (OIDC, no token — the workflow
#        itself is the credential; requires registration on npmjs.com
#        per package, npm's replacement for publish tokens which die
#        2027-01). Failures here are loud but non-fatal: Release
#        binaries are already live.
#
# Publishing a release = pushing a tag. Delete + re-push the tag to
# re-run (delete the Release first if it exists).
name: release

on:
  push:
    tags: ["log-labor-v*"]

permissions:
  contents: write
  id-token: write   # npm trusted publishing (OIDC) — no token secret

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-labor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # npm 11.x — trusted publishing needs it
          registry-url: "https://registry.npmjs.org"

      - name: build + package + assemble npm
        run: |
          VERSION="${GITHUB_REF_NAME#log-labor-}"
          npm/build.sh "$VERSION"

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#log-labor-}"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "log-labor ${VERSION}" \
            --generate-notes

      - name: publish npm packages (NPM_TOKEN or trusted publishing)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_all() {
            cd dist/npm/platforms
            for pkg in *; do
              echo "npm publish: @yyx462/$pkg"
              ( cd "$pkg" && npm publish --access public $1 )
            done
            echo "npm publish: log-labor (wrapper — last by design)"
            ( cd ../wrapper && npm publish --access public $1 )
          }
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            publish_all ""
            exit 0
          fi
          echo "npm: NPM_TOKEN not set — attempting trusted publishing (OIDC, no token)…"
          if publish_all "--provenance"; then
            echo "npm: trusted publish OK"
          else
            echo "npm: trusted publishing did not complete (normal until registered)."
            echo "npm: register this workflow as a Trusted Publisher per package on npmjs.com"
            echo "npm: (log-labor + @yyx462/* platforms → Settings → Trusted Publisher:"
            echo "npm:  repository yyx462/AutoWecom-plugin, workflow release.yml),"
            echo "npm: or set an NPM_TOKEN secret (stage-only is fine — approve on the website),"
            echo "npm: or publish locally: log-labor/npm/publish.sh (browser 2FA)."
            echo "npm: GitHub Release binaries above are live either way."
          fi
