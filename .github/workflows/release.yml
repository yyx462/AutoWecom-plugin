# release.yml — on tag log-labor-vX.Y.Z:
#   1. npm/build.sh cross-builds the 5 binaries, tars them (GitHub
#      Release assets — names must byte-match install.sh/install.ps1)
#      and assembles the 6 npm packages (wrapper + 5 platforms).
#   2. publishes the GitHub Release via the built-in GITHUB_TOKEN
#      (contents:write) — this is what makes the curl/PowerShell
#      one-liners work.
#   3. publishes the npm packages:
#      - NPM_TOKEN secret set → classic/granular token publish (a
#        stage-only token stages; approve the version on npmjs.com);
#      - otherwise → trusted publishing (OIDC, no token — the workflow
#        itself is the credential; requires registration on npmjs.com
#        per package, npm's replacement for publish tokens which die
#      2027-01). Any failed publish fails the job: a green run with
#      npm lagging behind shipped linux-arm64-less 0.1.3 once
#      (2026-09-14) and broke fresh installs — the wrapper pins exact
#      versions of its optionalDependencies.
#   4. visibility gate: platform publishes poll `npm view` until the
#      registry actually serves the new version (packuments replicate
#      per-package, unordered) — only then does the wrapper publish,
#      so `latest` never pins a missing binary.
#
# Publishing a release = pushing a tag. Delete + re-push the tag to
# re-run (delete the Release first if it exists).
name: release

on:
  push:
    tags: ["log-labor-v*"]

permissions:
  contents: write
  id-token: write   # npm trusted publishing (OIDC) — no token secret

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-labor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # npm 11.x — trusted publishing needs it
          registry-url: "https://registry.npmjs.org"

      - name: build + package + assemble npm
        run: |
          VERSION="${GITHUB_REF_NAME#log-labor-}"
          npm/build.sh "$VERSION"

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#log-labor-}"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "log-labor ${VERSION}" \
            --generate-notes

      - name: publish npm packages (NPM_TOKEN or trusted publishing)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=""
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "npm: NPM_TOKEN not set — using trusted publishing (OIDC, no token)…"
            ARGS="--provenance"
          fi
          fails=0; conflicts=0
          cd dist/npm/platforms
          for pkg in *; do
            echo "npm publish: @yyx462/$pkg"
            out=$( cd "$pkg" && npm publish --access public $ARGS 2>&1 ) || true
            echo "$out"
            if ! echo "$out" | grep -q "^+ @yyx462/"; then
              if echo "$out" | grep -qE "EPUBLISHCONFLICT|cannot publish over"; then
                echo "npm publish CONFLICT (already published — re-release): @yyx462/$pkg" >&2
                conflicts=$((conflicts+1))
              else
                echo "npm publish FAILED: @yyx462/$pkg" >&2
              fi
              fails=$((fails+1))
            fi
          done

          hard=$((fails-conflicts))
          if [ "$hard" -gt 0 ]; then
            echo "npm: $hard publish FAILED — the GitHub Release binaries above are live," >&2
            echo "npm: but npm lags behind and the wrapper pins exact platform versions," >&2
            echo "npm: so fresh installs break. Fix (trusted-publisher registration or" >&2
            echo "npm: NPM_TOKEN), then re-release: delete tag + Release, re-push tag." >&2
            exit 1
          fi
          [ "$conflicts" -gt 0 ] && echo "npm: $conflicts platform package(s) already published (re-release) — gate still applies"

          # Visibility gate (live 2026-09-14 ×2: 0.1.5's darwin-arm64
          # published first yet resolved last; 0.1.6's replication blew
          # past a 300s cap and the gate correctly blocked the wrapper):
          # registry packuments replicate per-package, unordered, and the
          # wrapper pins exact optionalDependencies which npm SILENTLY
          # SKIPS when unresolvable — latest-with-invisible-binaries
          # installs broken. Poll npm view (10s interval, 900s cap,
          # progress lines) for EVERY platform package before the wrapper
          # publish; conflicts count too (a re-released platform may
          # still be propagating).
          NPMV="${GITHUB_REF_NAME#log-labor-v}"
          echo "npm: waiting for platform packages to resolve @$NPMV…"
          deadline=$((SECONDS + 900))
          for pkg in *; do
            tries=0
            while [ "$(npm view "@yyx462/$pkg" version 2>/dev/null)" != "$NPMV" ]; do
              tries=$((tries+1))
              if [ $((tries % 6)) -eq 1 ]; then
                echo "npm: still waiting: @yyx462/$pkg @$NPMV not visible (${tries} tries, ${SECONDS}s)"
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "npm: @yyx462/$pkg@$NPMV still invisible after 900s — NOT publishing the wrapper." >&2
                echo "npm: reads replicate per-package (CDN/replicas); if this repeats," >&2
                echo "npm: suspect a stage-only NPM_TOKEN (versions need approval on" >&2
                echo "npm: npmjs.com) — approve/re-register, then re-release:" >&2
                echo "npm: delete tag + Release, re-push the tag." >&2
                exit 1
              fi
              sleep 10
            done
            echo "npm: @yyx462/$pkg resolves @$NPMV"
          done

          echo "npm publish: @yyx462/log-labor (wrapper — last by design)"
          if ! ( cd ../wrapper && npm publish --access public $ARGS ); then
            echo "npm publish FAILED: @yyx462/log-labor" >&2
            exit 1
          fi
          echo "npm: all 6 packages published"
