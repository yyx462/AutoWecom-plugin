# plugin/catalog.yaml — the model-tool registry (join key)
#
# One row = one capability the broker serves via /invoke. Rules:
#   - a row lands ONLY when its core handler exists (handler first, row second)
#   - a row without a live handler 404s by design — never a crash
#   - send_* and admin surfaces are never rows
#
# log-labor (this repo's first plugin) exposes its brain-side handler in
# core (broker labor handler); its catalog row lands when that handler is
# deployed. Humans and standalone agents do NOT need a row — they use the
# log-labor CLI directly.

tools: {}
